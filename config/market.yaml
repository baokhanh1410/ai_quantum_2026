# market.yaml - Microstructure Configuration for Vietnam Stock Market & Asset Classes

market_settings:
  market_name: "Vietnam Stock Market"
  currency: "VND"
  trading_days_per_year: 252
  risk_free_rate: 0.03

# 1. Transaction Costs & Tax Schedules (General Fallback)
transaction_costs:
  brokerage_fee_buy: 0.0015       # Buy brokerage fee (0.15%)
  brokerage_fee_sell: 0.0015      # Sell brokerage fee (0.15%)
  personal_income_tax_sell: 0.001 # Personal income tax on sell per Circular 92/2015/TT-BTC (0.10%)
  cash_advance_fee_daily: 0.0003  # Phí ứng trước tiền bán 0.03%/ngày (~10.95%/năm) nếu tái đầu tư tiền bán ngay T+0/T+1

  # Total effective friction:
  # - Buy side = 0.15%
  # - Sell side = 0.15% + 0.10% = 0.25%

# 2. Trading Rules & Lot Size Enforcement
trading_rules:
  lot_size: 100                   # Lot size 100 shares (Enforces int(shares / 100) * 100)
  min_order_value: 0              # Minimum order value in VND
  allow_short_selling: false      # Short selling restriction
  max_volume_liquidity_ratio: 0.10 # Giới hạn tỷ lệ thanh khoản tối đa 10% tổng khối lượng giao dịch phiên (ADTV)


# 3. Daily Price Limits per Exchange
price_limits:
  HOSE: 0.07                      # Daily limit +/- 7%
  HNX: 0.10                       # Daily limit +/- 10%
  UPCoM: 0.15                     # Daily limit +/- 15%

# 4. Systemic Risk Controls
# (Note: Turbulence Risk Control Settings are managed in config/model.yaml alongside reward_settings)

# 5. Asset Class Specific Microstructure & Execution Rules
asset_class_rules:
  # --- TÀI SẢN TẤN CÔNG: CỔ PHIẾU (HOSE, HNX, UPCoM) ---
  STOCK:
    asset_class_id: 1
    description: "Equities / Listed Stocks & Stock ETFs"
    locked_days_buy: 2           # Chu kỳ thanh toán T+2 (mua ngày t -> khả dụng ngày t+2)
    locked_days_sell: 0           # Tiền bán về T+2 nhưng có thể ứng trước tiền bán
    lot_size: 100                # Quy tắc lô chẵn 100 cổ phiếu
    buy_fee_pct: 0.0015          # Phí mua 0.15% (phí môi giới)
    sell_fee_pct: 0.0025         # Phí bán 0.25% (0.15% phí môi giới + 0.10% thuế TNCN)
    price_limit_ratio:
      HOSE: 0.07                 # Biên độ +/- 7%
      HNX: 0.10                  # Biên độ +/- 10%
      UPCoM: 0.15                # Biên độ +/- 15%

  # --- TÀI SẢN PHÒNG THỦ: CHỨNG CHỈ QUỸ TRÁI PHIẾU (BOND FUND) ---
  BOND_FUND:
    asset_class_id: 4
    description: "Bond Fund Certificates (Open-ended funds like TCBF, VBF)"
    locked_days_buy: 0           # Mua lệnh mở T+0
    locked_days_sell: 3          # Tiền rút vốn từ Quỹ trái phiếu mất 3 ngày làm việc mới về tài khoản
    min_order_value: 100000      # Giá trị đặt lệnh tối thiểu 100.000 VNĐ
    buy_fee_pct: 0.0000          # Miễn phí mua
    tiered_exit_fee:             # Biểu phí bán giảm dần theo thời gian nắm giữ
      under_30_days: 0.010       # Nắm giữ < 30 ngày: Phạt phí bán 1.0%
      under_180_days: 0.005      # Nắm giữ 30 - 180 ngày: Phí bán 0.5%
      under_365_days: 0.002      # Nắm giữ 180 - 365 ngày: Phí bán 0.2%
      over_365_days: 0.000       # Nắm giữ > 1 năm: Miễn phí bán (0%)

  # --- TÀI SẢN PHÒNG THỦ: VÀNG VẬT CHẤT & DIGITAL GOLD (SJC / eGold / XAUUSD) ---
  GOLD:
    asset_class_id: 5
    description: "Physical Gold SJC & Digital Gold Accumulation (eGold)"
    locked_days_buy: 0           # T+0 Tức thì nếu giao dịch Vàng số (DOJI eGold / TPBank)
    locked_days_sell: 0
    bid_ask_spread_pct: 0.020    # Chênh lệch giá Mua - Bán (Bid-Ask Spread ~2.0% tương đương 1.5 - 2M VNĐ/lượng)
    lot_size_unit: "1_CHI"       # Đơn vị lô chẵn 1 chỉ (~3.75g, ~8.7 triệu VNĐ)
    friction_penalty_weight: 0.20 # Phạt vòng quay vốn nặng trong Reward để hạn chế lướt sóng ngắn hạn
    sjc_premium_warning_threshold: 0.15 # Cảnh báo khi giá Vàng SJC cao hơn thế giới > 15%

  # --- TIỀN MẶT & TƯƠNG ĐƯƠNG TIỀN (CASH & MONEY MARKET) ---
  CASH:
    asset_class_id: 6
    description: "Cash Balance & Overnight Interbank Interest / Money Market"
    locked_days_buy: 0           # T+0 Khả dụng ngay lập tức
    locked_days_sell: 0
    buy_fee_pct: 0.0000          # Miễn phí
    sell_fee_pct: 0.0000
    interest_rate_feature: "VNIBOR_ON" # Lãi suất gửi tích lũy qua đêm liên ngân hàng
    min_cash_buffer_pct: 0.05    # Đệm tiền mặt tối thiểu 5% bảo vệ thanh khoản danh mục

# 6. User Portfolio Stock Selection
# Danh sách các mã cổ phiếu người dùng chọn đầu tư trong Model Engine
# Nếu rỗng hoặc không khai báo, hệ thống sẽ lấy tất cả cổ phiếu theo asset_class_ids trong model.yaml
portfolio_stocks:
  - "VNM"
  - "FPT"
  - "VCB"
  - "VHM"
  - "HPG"

