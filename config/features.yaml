version: "1.0"

# =====================================================================
# 1. TECHNICAL INDICATORS (Lưu vào indicator_types & technical_indicator_values)
# =====================================================================
technical_indicators:
  - name: "RSI"
    category: "trend"
    window_size: 14
    description: "Relative Strength Index"
    enabled: true

  - name: "PPO"
    category: "trend"
    window_size: 26
    description: "Percentage Price Oscillator"
    enabled: true

  - name: "CCI"
    category: "trend"
    window_size: 20
    description: "Commodity Channel Index"
    enabled: true

  - name: "ADX"
    category: "trend"
    window_size: 14
    description: "Average Directional Index"
    enabled: true

  - name: "ATR"
    category: "volatility"
    window_size: 14
    description: "Average True Range"
    enabled: true

  - name: "VOLATILITY"
    category: "volatility"
    window_size: 20
    description: "Rolling Volatility"
    enabled: true

# =====================================================================
# 2. MACRO INDICATORS (Lưu vào macro_types & macro_values)
# =====================================================================
macro_indicators:
  - name: "YIELD_CURVE_SLOPE"
    unit: "%"
    description: "Spread between Vietnam 10-Year and 3-Year Government Bond Yields"
    enabled: true

  - name: "DXY_LOG_RETURN"
    unit: "ratio"
    description: "US Dollar Index (DXY) Log-Return"
    enabled: true

  - name: "SJC_PREMIUM"
    unit: "ratio"
    description: "Difference between domestic SJC and world spot gold price"
    enabled: true

  - name: "VN3YT"
    unit: "%"
    description: "Vietnam 3-Year Government Bond Yield (Risk-Free Rate Proxy)"
    enabled: true

# =====================================================================
# PIPELINE EXECUTION SETTINGS
# =====================================================================
pipeline_settings:
  target_asset_class_ids: [5, 6, 7, 8]
  drop_nan: true
  save_mode: "append"
  scale_features: false
  scaler_path: "models/scalers/standard_scaler.pkl"
