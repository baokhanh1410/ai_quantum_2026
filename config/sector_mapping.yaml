# ==============================================================================
# STOCK SECTOR MAPPING TABLE
# Maps ICB sector standards from Vnstock to HOSE Sector Indices (VNDirect)
# ==============================================================================

# List of available sector index tickers in the system (from api.yaml):
# - VNFIN: Financials (Banking, Brokerage, Insurance)
# - VNREAL: Real Estate
# - VNMAT: Basic Materials (Steel, Chemicals, Rubber)
# - VNIND: Industrials (Construction, Transportation, Ports)
# - VNCONS: Consumer Staples (Food & Beverage, Agriculture)
# - VNCOND: Consumer Discretionary (Retail, Household Goods, Media)
# - VNENE: Energy (Oil & Gas)
# - VNUTI: Utilities (Electricity, Water)
# - VNIT: Information Technology & Telecom
# - VNHEAL: Healthcare & Pharmaceuticals

mapping:
  # --- FINANCIALS (VNFIN) ---
  "Ngân hàng": "VNFIN"
  "Dịch vụ tài chính": "VNFIN" # Securities firms
  "Bảo hiểm": "VNFIN"
  "Quỹ mở": "VNFIN"
  
  # --- REAL ESTATE (VNREAL) ---
  "Bất động sản": "VNREAL"
  
  # --- BASIC MATERIALS (VNMAT) ---
  "Tài nguyên Cơ bản": "VNMAT" # Steel, Mining
  "Hóa chất": "VNMAT" # Fertilizers, Chemicals, Rubber
  
  # --- INDUSTRIALS & CONSTRUCTION (VNIND) ---
  "Xây dựng và Vật liệu": "VNIND"
  "Hàng hóa và Dịch vụ Công nghiệp": "VNIND" # Logistics, Shipping, Ports
  
  # --- CONSUMER STAPLES & DISCRETIONARY (VNCONS / VNCOND) ---
  "Thực phẩm và Đồ uống": "VNCONS"
  "Hàng cá nhân & Gia dụng": "VNCOND"
  "Bán lẻ": "VNCOND" # Retailers (MWG, PNJ, FRT)
  "Truyền thông": "VNCOND"
  "Ô tô và phụ tùng": "VNCOND"
  "Du lịch và Giải trí": "VNCOND" # Aviation, Tourism
  
  # --- ENERGY (VNENE) ---
  "Dầu khí": "VNENE"
  
  # --- UTILITIES (VNUTI) ---
  "Điện, nước & xăng dầu khí đốt": "VNUTI"
  
  # --- INFORMATION TECHNOLOGY (VNIT) ---
  "Công nghệ Thông tin": "VNIT"
  "Viễn thông": "VNIT"
  
  # --- HEALTHCARE (VNHEAL) ---
  "Y tế": "VNHEAL"

default_fallback: "VN100" # Fallback index if sector mapping is not found

